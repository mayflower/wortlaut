apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector: {app: wortlaut-rustfs}
  ports:
    - port: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels: {app: wortlaut-rustfs}
  template:
    metadata:
      labels: {app: wortlaut-rustfs}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          args: [/data]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: wortlaut-storage, key: WORTLAUT_S3_ACCESS_KEY}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: wortlaut-storage, key: WORTLAUT_S3_SECRET_KEY}}
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ''
          ports: [{containerPort: 9000}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests: {storage: 10Gi}
