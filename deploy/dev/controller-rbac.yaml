apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wortlaut-controller
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, patch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, delete]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [wortlaut-webex]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wortlaut-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wortlaut-controller
subjects:
  - kind: ServiceAccount
    name: wortlaut-meeting
