apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: wortlaut-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: wortlaut-postgres
  template:
    metadata:
      labels:
        app: wortlaut-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
          env:
            - name: POSTGRES_USER
              value: wortlaut
            - name: POSTGRES_DB
              value: wortlaut
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wortlaut-runtime
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe:
            exec:
              command: [pg_isready, -U, wortlaut, -d, wortlaut]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
