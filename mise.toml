# Single source of truth for local development and QA tool versions.
# Aligned with .github/workflows/checks.yml and services/*/Dockerfile.
# Run `mise install` to provision everything locally (Linux amd64/arm64, macOS).

[tools]
python = "3.14"
node = "26"
uv = "0.13.9"
helm = "4.3"
kubectl = "1.35"
kind = "0.33"
tilt = "0.37"
kubeconform = "0.8.0"
hadolint = "2.15.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
trivy = "0.76"
gitleaks = "8.30"
