host: wortlaut.example.org
defaultLocale: de

images:
  meeting: ghcr.io/mayflower/wortlaut-meeting:latest
  worker: ghcr.io/mayflower/wortlaut-worker:latest
  asr: ghcr.io/mayflower/wortlaut-asr:latest
  pullPolicy: IfNotPresent

providers:
  enableGoogleMeet: true
  enableTeams: true
  enableZoom: true
  zoomLocale: en-US
  enableWebexBrowser: true

keyframes:
  # Settled screen-share slide snapshots (<= 1280x720 PNG); participant camera feeds are never recorded.
  enabled: true

oidc:
  issuer: ""
  clientId: wortlaut
  displayName: ""
  googleClientId: ""
  entraClientId: ""
  entraTenantId: ""
  entraAllowedTenants: []
  allowedDomains: []
  adminEmails: []
  # Optional Kubernetes Secret holding WORTLAUT_OIDC_CLIENT_SECRET,
  # WORTLAUT_GOOGLE_AUTH_CLIENT_SECRET, and/or WORTLAUT_ENTRA_AUTH_CLIENT_SECRET:
  secretName: wortlaut-auth

calendarOAuth:
  googleClientId: ""
  microsoftClientId: ""
  microsoftTenantId: common
  secretName: wortlaut-calendar-oauth

llmSummary:
  enabled: false
  ollamaUrl: ""
  ollamaModel: qwen3.8:latest
  openaiBaseUrl: ""
  openaiModel: gpt-4o-mini
  openaiTimeoutSeconds: 120

capacity:
  maxActiveMeetings: 15
  maxPendingSamplesTotal: 1728000000
  maxStoredAudioBytes: 8589934592
  maxOpenAsrJobs: 8192

asr:
  enabled: true
  allowCpu: false
  gpuCount: 1
  # Qwen3-ASR 1.7B (Transformers), all 30 languages enabled by default (`*`, or comma-separated subset).
  modelRepo: Qwen/Qwen3-ASR-1.7B-hf
  languages: "*"
  glossary: ""
  storageClassName: ""
  cacheSize: 20Gi

# Zero-dependency evaluation / homelab mode:
# Provisions embedded PostgreSQL 17, RustFS S3, and auto-generated Secrets in-namespace.
bundled:
  enabled: false
  apiToken: ""
  storageClassName: ""
  postgresSize: 10Gi
  rustfsSize: 10Gi

secrets:
  runtimeSecretName: wortlaut-runtime
  storageSecretName: wortlaut-storage
  asrSecretName: wortlaut-asr
  webexSecretName: wortlaut-webex
  mailSecretName: wortlaut-mail
  meetSecretName: wortlaut-meet
  teamsSecretName: wortlaut-teams
  zoomSecretName: wortlaut-zoom

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt
  tlsSecretName: wortlaut-tls

otlpEndpoint: ""
