host: wortlaut.example.org
defaultLocale: de

images:
  meeting: ghcr.io/mayflower/wortlaut-meeting:latest
  worker: ghcr.io/mayflower/wortlaut-worker:latest
  asr: ghcr.io/mayflower/wortlaut-asr:latest
  pullPolicy: IfNotPresent

providers:
  enableGoogleMeet: true
  enableTeams: true
  enableZoom: true
  zoomLocale: en-US
  enableWebexBrowser: false

oidc:
  issuer: ""
  clientId: wortlaut
  allowedDomains: []
  adminEmails: []

llmSummary:
  enabled: false

capacity:
  maxActiveMeetings: 15
  maxPendingSamplesTotal: 1728000000
  maxStoredAudioBytes: 8589934592
  maxOpenAsrJobs: 8192

asr:
  enabled: true
  allowCpu: false
  gpuCount: 1
  # Qwen3-ASR 1.7B (Transformers), constrained by default to German,English (`*` for all 30 languages).
  modelRepo: Qwen/Qwen3-ASR-1.7B-hf
  languages: German,English
  storageClassName: ""
  cacheSize: 20Gi

# Zero-dependency evaluation / homelab mode:
# Provisions embedded PostgreSQL 17, RustFS S3, and auto-generated Secrets in-namespace.
bundled:
  enabled: false
  apiToken: ""
  storageClassName: ""
  postgresSize: 10Gi
  rustfsSize: 10Gi

secrets:
  runtimeSecretName: wortlaut-runtime
  storageSecretName: wortlaut-storage
  asrSecretName: wortlaut-asr
  webexSecretName: wortlaut-webex
  mailSecretName: wortlaut-mail
  meetSecretName: wortlaut-meet
  teamsSecretName: wortlaut-teams

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt
  tlsSecretName: wortlaut-tls

otlpEndpoint: ""
