host: wortlaut.example.org
defaultLocale: de

images:
  meeting: ghcr.io/mayflower/wortlaut-meeting:latest
  worker: ghcr.io/mayflower/wortlaut-worker:latest
  asr: ghcr.io/mayflower/wortlaut-asr:latest
  asrCpu: ghcr.io/mayflower/wortlaut-asr-cpu:latest
  pullPolicy: IfNotPresent

providers:
  enableGoogleMeet: true
  enableTeams: true
  enableZoom: true
  zoomLocale: en-US
  enableWebexBrowser: true

keyframes:
  # Settled screen-share slide snapshots (<= 1280x720 PNG); participant camera feeds are never recorded.
  enabled: true

oidc:
  issuer: ""
  clientId: wortlaut
  displayName: ""
  googleClientId: ""
  entraClientId: ""
  entraTenantId: ""
  entraAllowedTenants: []
  allowedDomains: []
  adminEmails: []
  # Optional Kubernetes Secret holding WORTLAUT_OIDC_CLIENT_SECRET,
  # WORTLAUT_GOOGLE_AUTH_CLIENT_SECRET, and/or WORTLAUT_ENTRA_AUTH_CLIENT_SECRET:
  secretName: wortlaut-auth

calendarOAuth:
  googleClientId: ""
  microsoftClientId: ""
  microsoftTenantId: common
  secretName: wortlaut-calendar-oauth

llmSummary:
  enabled: false
  # Set to false to disable external OpenAI query-term expansion in MCP search_protocols
  # even when openaiBaseUrl is configured.
  enableQueryExpansion: true
  ollamaUrl: ""
  ollamaModel: qwen3.8:latest
  openaiBaseUrl: ""
  openaiModel: gpt-4o-mini
  openaiTimeoutSeconds: 120

worker:
  # Chromium seccomp mode: "Unconfined" (default) or "Localhost" with a node-installed
  # profile such as charts/wortlaut/examples/worker-seccomp-chromium.json.
  seccompType: Unconfined
  seccompProfile: ""

networkPolicies:
  # Enable Kubernetes NetworkPolicies isolating worker pods from PostgreSQL, RustFS, ASR,
  # and cloud metadata (169.254.169.254) on clusters whose CNI enforces NetworkPolicy.
  enabled: false
  # Optional extra CIDRs reachable by browser workers (e.g. corporate conference proxies):
  allowPrivateWorkerEgressCidrs: []
  # Optional namespace labels for the cluster Ingress controller targeting wortlaut-meeting:8000:
  ingressControllerNamespaceLabels: {}

capacity:
  maxActiveMeetings: 15
  maxPendingSamplesTotal: 1728000000
  maxStoredAudioBytes: 8589934592
  maxOpenAsrJobs: 8192

asr:
  enabled: true
  # Speech-to-text backend: "qwen3" (Qwen3-ASR 1.7B, 30 languages, GPU recommended)
  # or "parakeet" (Parakeet TDT 0.6B v3 ONNX, 25 European languages, fast on CPU or GPU).
  backend: qwen3
  # Execution device: "auto" (GPU when available), "cuda", "cpu", or "mps".
  device: auto
  # Precision/quantization: "auto" (int8 for Parakeet/CPU, fp32 for Parakeet/CUDA,
  # bfloat16 for Qwen3/CUDA, float32 for Qwen3/CPU), "int8", "fp32", "bfloat16", "float16", "float32".
  quantization: auto
  allowCpu: false
  gpuCount: 1
  # Optional Hugging Face repo/revision override (empty uses the backend's pinned default).
  modelRepo: ""
  modelRevision: ""
  languages: "*"
  glossary: ""
  storageClassName: ""
  cacheSize: 20Gi

# Zero-dependency evaluation / homelab mode:
# Provisions embedded PostgreSQL 17, RustFS S3, and auto-generated Secrets in-namespace.
bundled:
  enabled: false
  apiToken: ""
  encryptionKey: ""
  storageClassName: ""
  postgresSize: 10Gi
  rustfsSize: 10Gi

secrets:
  runtimeSecretName: wortlaut-runtime
  storageSecretName: wortlaut-storage
  asrSecretName: wortlaut-asr
  webexSecretName: wortlaut-webex
  mailSecretName: wortlaut-mail
  meetSecretName: wortlaut-meet
  teamsSecretName: wortlaut-teams
  zoomSecretName: wortlaut-zoom

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt
  tlsSecretName: wortlaut-tls

otlpEndpoint: ""
