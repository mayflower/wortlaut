apiVersion: v1
kind: ConfigMap
metadata:
  name: wortlaut-config
  namespace: {{ .Release.Namespace }}
data:
  WORTLAUT_NAMESPACE: {{ .Release.Namespace | quote }}
  WORTLAUT_DEFAULT_LOCALE: {{ .Values.defaultLocale | quote }}
  WORTLAUT_API_URL: {{ if .Values.ingress.enabled }}{{ printf "https://%s/" .Values.host | quote }}{{ else }}"http://wortlaut-meeting:8000/"{{ end }}
  WORTLAUT_SDK_PAGE_URL: {{ if .Values.ingress.enabled }}{{ printf "https://%s/sdk/" .Values.host | quote }}{{ else }}"http://wortlaut-meeting:8000/sdk/"{{ end }}
  WORTLAUT_ENABLE_CONTROLLER: "true"
  WORTLAUT_CONTROLLER_BACKEND: "kubernetes"
  WORTLAUT_S3_CREATE_BUCKET: "true"
  WORTLAUT_ENABLE_GOOGLE_MEET: {{ .Values.providers.enableGoogleMeet | ternary "true" "false" | quote }}
  WORTLAUT_ENABLE_TEAMS: {{ .Values.providers.enableTeams | ternary "true" "false" | quote }}
  WORTLAUT_ENABLE_ZOOM: {{ .Values.providers.enableZoom | ternary "true" "false" | quote }}
  WORTLAUT_ZOOM_LOCALE: {{ .Values.providers.zoomLocale | quote }}
  WORTLAUT_ENABLE_WEBEX_BROWSER: {{ .Values.providers.enableWebexBrowser | ternary "true" "false" | quote }}
  WORTLAUT_ENABLE_KEYFRAMES: {{ .Values.keyframes.enabled | ternary "true" "false" | quote }}
  WORTLAUT_ASR_LANGUAGES: {{ .Values.asr.languages | quote }}
  WORTLAUT_ENABLE_LLM_SUMMARY: {{ .Values.llmSummary.enabled | ternary "true" "false" | quote }}
{{- if .Values.llmSummary.ollamaUrl }}
  WORTLAUT_OLLAMA_URL: {{ .Values.llmSummary.ollamaUrl | quote }}
{{- end }}
{{- if .Values.llmSummary.ollamaModel }}
  WORTLAUT_OLLAMA_MODEL: {{ .Values.llmSummary.ollamaModel | quote }}
{{- end }}
{{- if .Values.llmSummary.openaiBaseUrl }}
  WORTLAUT_OPENAI_BASE_URL: {{ .Values.llmSummary.openaiBaseUrl | quote }}
  WORTLAUT_OPENAI_MODEL: {{ .Values.llmSummary.openaiModel | default "gpt-4o-mini" | quote }}
  WORTLAUT_OPENAI_TIMEOUT_SECONDS: {{ .Values.llmSummary.openaiTimeoutSeconds | default 120 | int64 | toString | quote }}
{{- end }}
{{- if .Values.calendarOAuth.googleClientId }}
  WORTLAUT_GOOGLE_CALENDAR_CLIENT_ID: {{ .Values.calendarOAuth.googleClientId | quote }}
{{- end }}
{{- if .Values.calendarOAuth.microsoftClientId }}
  WORTLAUT_MICROSOFT_CALENDAR_CLIENT_ID: {{ .Values.calendarOAuth.microsoftClientId | quote }}
  WORTLAUT_MICROSOFT_CALENDAR_TENANT_ID: {{ .Values.calendarOAuth.microsoftTenantId | default "common" | quote }}
{{- end }}
{{- if .Values.asr.glossary }}
  WORTLAUT_ASR_GLOSSARY: {{ .Values.asr.glossary | quote }}
{{- end }}
  WORTLAUT_MAX_ACTIVE_MEETINGS: {{ .Values.capacity.maxActiveMeetings | int64 | toString | quote }}
  WORTLAUT_MAX_PENDING_SAMPLES_TOTAL: {{ .Values.capacity.maxPendingSamplesTotal | int64 | toString | quote }}
  WORTLAUT_MAX_STORED_AUDIO_BYTES: {{ .Values.capacity.maxStoredAudioBytes | int64 | toString | quote }}
  WORTLAUT_MAX_OPEN_ASR_JOBS: {{ .Values.capacity.maxOpenAsrJobs | int64 | toString | quote }}
{{- if .Values.oidc.issuer }}
  WORTLAUT_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  WORTLAUT_OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
{{- if .Values.oidc.displayName }}
  WORTLAUT_OIDC_DISPLAY_NAME: {{ .Values.oidc.displayName | quote }}
{{- end }}
{{- end }}
{{- if .Values.oidc.googleClientId }}
  WORTLAUT_GOOGLE_AUTH_CLIENT_ID: {{ .Values.oidc.googleClientId | quote }}
{{- end }}
{{- if and .Values.oidc.entraClientId .Values.oidc.entraTenantId }}
  WORTLAUT_ENTRA_AUTH_CLIENT_ID: {{ .Values.oidc.entraClientId | quote }}
  WORTLAUT_ENTRA_AUTH_TENANT_ID: {{ .Values.oidc.entraTenantId | quote }}
{{- if .Values.oidc.entraAllowedTenants }}
  WORTLAUT_ENTRA_AUTH_ALLOWED_TENANTS: {{ .Values.oidc.entraAllowedTenants | toJson | quote }}
{{- end }}
{{- end }}
{{- if or .Values.oidc.issuer .Values.oidc.googleClientId (and .Values.oidc.entraClientId .Values.oidc.entraTenantId) }}
  WORTLAUT_OIDC_ALLOWED_DOMAINS: {{ .Values.oidc.allowedDomains | toJson | quote }}
  WORTLAUT_OIDC_ADMIN_EMAILS: {{ .Values.oidc.adminEmails | toJson | quote }}
{{- end }}
{{- if .Values.otlpEndpoint }}
  WORTLAUT_OTLP_ENDPOINT: {{ .Values.otlpEndpoint | quote }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wortlaut-meeting
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wortlaut-controller
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wortlaut-controller
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: wortlaut-meeting
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wortlaut-controller
