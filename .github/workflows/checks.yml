name: Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: PostgreSQL, S3 and browser fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: wortlaut_test
          POSTGRES_PASSWORD: fixture-postgres-password
          POSTGRES_DB: wortlaut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wortlaut_test -d wortlaut_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Disposable fixture services only. Provider, native GPU and live-cluster
      # tests remain opt-in; no production credentials enter PR workflows.
      WORTLAUT_TEST_DATABASE_URL: postgresql+psycopg://wortlaut_test:fixture-postgres-password@127.0.0.1:5432/wortlaut_test
      WORTLAUT_TEST_S3_ENDPOINT: http://127.0.0.1:24609
      WORTLAUT_S3_ACCESS_KEY: fixture-s3-user
      WORTLAUT_S3_SECRET_KEY: fixture-s3-password
      PYTEST_ADDOPTS: --tb=line -ra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.23
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install locked dependencies
        run: |
          uv sync --directory services/meeting --locked
          npm --prefix worker ci --no-audit --no-fund
      - name: Start disposable S3 fixture
        run: |
          docker run --detach --name wortlaut-test-s3 \
            --publish 127.0.0.1:24609:9000 \
            --env RUSTFS_ACCESS_KEY=fixture-s3-user \
            --env RUSTFS_SECRET_KEY=fixture-s3-password \
            --env RUSTFS_OBS_LOG_DIRECTORY= \
            rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2 /data
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:24609/health/ready
      - name: Lint and behavior tests with PostgreSQL/S3
        run: |
          make lint
          helm lint charts/wortlaut
          helm lint charts/wortlaut --set bundled.enabled=true
          helm template wortlaut charts/wortlaut --namespace wortlaut >/dev/null
          helm template wortlaut charts/wortlaut --namespace wortlaut --set bundled.enabled=true >/dev/null
          docker compose config --quiet
          make test
      - name: Build both browser capture bundles
        run: npm --prefix worker run build
      - name: Install pinned Chromium
        working-directory: worker
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xdotool
          npx playwright install --with-deps chromium
      - name: Native browser fixtures (no real provider identity proof)
        working-directory: worker
        run: |
          npm run test:audio
          npm run test:meet
