name: Release & Container Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-images:
    name: Build & publish GHCR images (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: meeting
            dockerfile: services/meeting/Dockerfile
            platforms: linux/amd64,linux/arm64
            free_disk: false
          - component: worker
            dockerfile: services/worker/Dockerfile
            platforms: linux/amd64
            free_disk: false
          - component: asr
            dockerfile: services/asr/Dockerfile
            platforms: linux/amd64
            free_disk: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Reclaim runner disk space for CUDA/NeMo build
        if: matrix.free_disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up QEMU for multi-arch builds
        if: contains(matrix.platforms, 'arm64')
        run: |
          docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install arm64

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name wortlaut-ci --driver docker-container --use

      - name: Build and push ghcr.io/${{ github.repository_owner }}/wortlaut-${{ matrix.component }}
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/wortlaut-${{ matrix.component }}"
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          TAGS="--tag ${IMAGE}:sha-${SHORT_SHA}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS} --tag ${IMAGE}:${VERSION} --tag ${IMAGE}:latest"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${TAGS} --tag ${IMAGE}:edge --tag ${IMAGE}:latest"
          fi
          docker buildx build \
            --platform "${{ matrix.platforms }}" \
            --file "${{ matrix.dockerfile }}" \
            ${TAGS} \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --push \
            .

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "wortlaut ${GITHUB_REF_NAME}" \
              --generate-notes
