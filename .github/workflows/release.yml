name: Release & Container Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  publish-images:
    name: Build & publish GHCR images (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: meeting
            dockerfile: services/meeting/Dockerfile
            platforms: linux/amd64,linux/arm64
            free_disk: false
          - component: worker
            dockerfile: services/worker/Dockerfile
            platforms: linux/amd64
            free_disk: false
          - component: asr
            dockerfile: services/asr/Dockerfile
            platforms: linux/amd64
            free_disk: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk space for CUDA/PyTorch build
        if: matrix.free_disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Log in to GitHub Container Registry
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_ACTOR}" --password-stdin

      - name: Set up QEMU for multi-arch builds
        if: contains(matrix.platforms, 'arm64')
        run: |
          docker run --privileged --rm docker.io/tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install arm64

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name wortlaut-ci --driver docker-container --use

      - name: Build and push ghcr.io/${{ github.repository_owner }}/wortlaut-${{ matrix.component }}
        id: push
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          COMPONENT: ${{ matrix.component }}
          PLATFORMS: ${{ matrix.platforms }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          OWNER="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/wortlaut-${COMPONENT}"
          SHORT_SHA="${GIT_SHA:0:7}"
          TAG_ARGS=(--tag "${IMAGE}:sha-${SHORT_SHA}")
          if [[ "${GIT_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_ARGS+=(--tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:latest")
          elif [[ "${GIT_REF}" == "refs/heads/main" ]]; then
            TAG_ARGS+=(--tag "${IMAGE}:edge" --tag "${IMAGE}:latest")
          fi
          METADATA_FILE="$(mktemp)"
          docker buildx build \
            --platform "${PLATFORMS}" \
            --file "${DOCKERFILE}" \
            --provenance=mode=max \
            --sbom=true \
            "${TAG_ARGS[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${REPO_FULL}" \
            --label "org.opencontainers.image.revision=${GIT_SHA}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --metadata-file "${METADATA_FILE}" \
            --push \
            .
          DIGEST="$(jq -r '."containerimage.digest"' "${METADATA_FILE}")"
          printf 'image=%s\ndigest=%s\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign for keyless image signing
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign published image digest with Sigstore Cosign (keyless OIDC)
        env:
          IMAGE_REF: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Scan published image for OS & package CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: trivy-image-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL

      - name: Upload image CVE SARIF to GitHub Code Scanning
        if: always() && hashFiles(format('trivy-image-{0}.sarif', matrix.component)) != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-image-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "wortlaut ${GITHUB_REF_NAME}" \
              --generate-notes
