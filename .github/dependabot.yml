version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/services/meeting"
    schedule:
      interval: "weekly"
    groups:
      python-meeting:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      worker-npm:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/services/meeting"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/worker"
    schedule:
      interval: "weekly"
