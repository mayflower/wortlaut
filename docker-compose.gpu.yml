# NVIDIA GPU override for Docker Compose:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  asr:
    environment:
      WORTLAUT_ASR_ALLOW_CPU: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
