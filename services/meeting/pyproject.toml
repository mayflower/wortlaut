[project]
name = "wortlaut-meeting"
version = "0.2.0"
description = "Webex capture coordination and durable per-source transcription"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "boto3>=1.40,<2",
  "kubernetes==37.0.3",
  "icalendar==7.3.2",
  "recurring-ical-events==3.8.2",
  "dkimpy==1.1.8",
  "cryptography>=44,<51",
  "PyJWT>=2.9,<3",
  "mcp>=1.9,<3",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
]

[dependency-groups]
dev = [
    "aiosmtpd==1.4.6",
    "basedpyright>=1.29,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "vulture>=2.14,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wortlaut"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "S",
    "DTZ",
    "ASYNC",
    "SIM",
    "RET",
    "PERF",
    "RUF",
    "T20",
    "C90",
]
ignore = [
    "RUF001", # Ambiguous Unicode characters in German UI/protocol strings (en-dash, quotes)
    "RUF002", # Ambiguous Unicode characters in German docstrings
    "RUF003", # Ambiguous Unicode characters in German comments
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "S108",
    "S110",
    "S112",
    "S310",
    "S311",
    "S603",
    "S607",
    "T20",
    "C901",
    "SIM",
    "PERF",
    "RET",
    "RUF",
    "DTZ",
]
"migrations/**" = ["C901", "E501", "S101"]
# Existing high-complexity orchestrators tracked for incremental decomposition;
# new modules and helpers remain guarded by C901 <= 25.
"src/wortlaut/app.py" = ["C901"]
"src/wortlaut/asr.py" = ["C901"]
"src/wortlaut/calendar.py" = ["C901"]
"src/wortlaut/controller.py" = ["C901"]
"src/wortlaut/exports.py" = ["C901"]
"src/wortlaut/keyframe_privacy.py" = ["C901"]
"src/wortlaut/mail.py" = ["C901"]
"src/wortlaut/mcp_server.py" = ["C901"]
"src/wortlaut/processing.py" = ["C901"]
"src/wortlaut/rag.py" = ["C901"]
"src/wortlaut/recurrence.py" = ["C901"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests", "alembic", ".venv"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportUnusedImport = "warning"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportOptionalMemberAccess = "none"
reportOptionalOperand = "none"

[tool.vulture]
min_confidence = 80
paths = ["src"]
ignore_decorators = [
    "@app.*",
    "@router.*",
    "@field_validator",
    "@model_validator",
    "@asynccontextmanager",
]
ignore_names = [
    "model_config",
    "__tablename__",
    "__table_args__",
    "__mapper_args__",
]
