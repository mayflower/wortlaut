[project]
name = "wortlaut-meeting"
version = "0.1.0"
description = "Webex capture coordination and durable per-source transcription"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "boto3>=1.40,<2",
  "webrtcvad-wheels==2.0.14.post1",
  "kubernetes==34.1.0",
  "icalendar==7.3.0",
  "recurring-ical-events==3.8.2",
]

[dependency-groups]
dev = [
    "aiosmtpd==1.4.6",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wortlaut"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
